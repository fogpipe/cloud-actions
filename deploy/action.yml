name: "Fogpipe Cloud deploy"
description: >-
  Create or update a Fogpipe Cloud app with a new image, using a Fogpipe Cloud API key
  (FPCLOUD_API_KEY, from fogpipe/cloud-actions/auth). First run creates the app;
  later runs roll out the new image.

# Run fogpipe/cloud-actions/auth first (it exports FPCLOUD_API_KEY).
inputs:
  project:
    description: "Project name."
    required: true
  app:
    description: "App name."
    required: true
  image:
    description: "Fully-qualified image ref to deploy."
    required: true
  port:
    description: "Container port the app listens on."
    required: false
    default: "8080"
  ingress:
    description: "Ingress mode: all (public) or internal."
    required: false
    default: "all"
  release:
    description: >-
      Name of the release this deploy publishes, which is what
      `fpcloud app rollback <release>` later aims at. Left out, the platform
      derives it from the image: the tag (`v2.1.18`), or the tag with the
      build's short digest when the tag repeats on another build.
    required: false
    default: ""
  api-url:
    description: "Fogpipe Cloud API base URL."
    required: false
    default: "https://api.cloud.fogpipe.com"
outputs:
  url:
    description: "The app's URL, if assigned."
    value: ${{ steps.deploy.outputs.url }}
runs:
  using: "composite"
  steps:
    - id: deploy
      shell: bash
      env:
        FPCLOUD_API_URL: ${{ inputs.api-url }}
        PROJECT: ${{ inputs.project }}
        APP: ${{ inputs.app }}
        IMAGE: ${{ inputs.image }}
        PORT: ${{ inputs.port }}
        INGRESS: ${{ inputs.ingress }}
        RELEASE: ${{ inputs.release }}
      run: |
        set -euo pipefail
        if [ -z "${FPCLOUD_API_KEY:-}" ]; then
          echo "::error::FPCLOUD_API_KEY is not set — run fogpipe/cloud-actions/auth first." >&2
          exit 1
        fi
        base="${FPCLOUD_API_URL%/}"
        auth=(-H "Authorization: Bearer ${FPCLOUD_API_KEY}" -H "Content-Type: application/json")
        apps="$(curl -sS "${auth[@]}" "${base}/api/v1/projects/${PROJECT}/apps")"
        id="$(printf '%s' "${apps}" | jq -r --arg n "${APP}" '.[]? | select(.name==$n) | .id' | head -1)"
        if [ -z "${id}" ] || [ "${id}" = "null" ]; then
          echo "Creating app ${APP} in ${PROJECT}…"
          resp="$(curl -sS "${auth[@]}" -X POST "${base}/api/v1/projects/${PROJECT}/apps" \
            -d "$(jq -n --arg n "${APP}" --arg i "${IMAGE}" --argjson p "${PORT}" --arg ing "${INGRESS}" \
                  '{name:$n,image:$i,port:$p,ingress:$ing}')")"
        else
          echo "Deploying new image to ${APP} (${id})…"
          resp="$(curl -sS "${auth[@]}" -X POST "${base}/api/v1/apps/${id}/deploy" \
            -d "$(jq -n --arg i "${IMAGE}" --arg r "${RELEASE}" \
                  '{image:$i} + (if $r == "" then {} else {release:$r} end)')")"
        fi
        if ! printf '%s' "${resp}" | jq -e '.id' >/dev/null 2>&1; then
          echo "::error::Deploy failed: $(printf '%s' "${resp}" | jq -r '.error // .message // .' 2>/dev/null || printf '%s' "${resp}")" >&2
          exit 1
        fi
        # The API answers a create or a deploy with the app and records the outcome
        # on its newest deployment. A release-gated call returns while the release
        # command still runs as a Job; an ungated one the cluster refused returns
        # 200 with the record already failed. Either way the record decides this
        # step, and the app the call returned decides when no record was written.
        id="$(printf '%s' "${resp}" | jq -r '.id')"
        status=""
        for _ in $(seq 1 600); do
          dep="$(curl -sS "${auth[@]}" "${base}/api/v1/apps/${id}/deployments" | jq -c '.[0] // empty')"
          status="$(printf '%s' "${dep}" | jq -r '.status // empty')"
          case "${status}" in
            deploying|releasing) sleep 3 ;;
            failed)
              echo "::error::Deploy failed: $(printf '%s' "${dep}" | jq -r '.message // "see fpcloud app deployments"')" >&2
              logs="$(printf '%s' "${dep}" | jq -r '.release_logs // empty')"
              if [ -n "${logs}" ]; then
                printf -- '--- release command output ---\n%s\n' "${logs}" >&2
              fi
              exit 1 ;;
            *) break ;;
          esac
        done
        case "${status}" in
          deploying|releasing)
            echo "::error::Timed out waiting for the rollout to finish." >&2
            exit 1 ;;
        esac
        if [ "$(printf '%s' "${resp}" | jq -r '.status // empty')" = "failed" ]; then
          echo "::error::Deploy failed: see fpcloud app deployments." >&2
          exit 1
        fi
        url="$(printf '%s' "${resp}" | jq -r '.url // empty')"
        echo "url=${url}" >> "${GITHUB_OUTPUT}"
        echo "OK: $(printf '%s' "${resp}" | jq -c '{name,status,url}')"
