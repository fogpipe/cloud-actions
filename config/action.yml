name: "Fogpipe Cloud config"
description: >-
  Set app config on Fogpipe Cloud from GitHub Actions. Reuses the short-lived
  FPCLOUD_API_KEY minted by fogpipe/cloud-actions/auth (no stored key). Values
  are plain env, rendered into the app and rolled out; a credential belongs in
  a project secret mounted as a file, not here.

# Requires the calling job to grant:  permissions: { id-token: write }
# and a prior `uses: fogpipe/cloud-actions/auth` step to export FPCLOUD_API_KEY.

inputs:
  project:
    description: "Project name (or id) the app belongs to."
    required: true
  app:
    description: "App name."
    required: true
  env:
    description: "Plain config as newline-separated KEY=VALUE pairs."
    required: false
    default: ""
  api-url:
    description: "Fogpipe Cloud API base URL."
    required: false
    default: "https://api.cloud.fogpipe.com"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        FPCLOUD_PROJECT: ${{ inputs.project }}
        FPCLOUD_APP: ${{ inputs.app }}
        FPCLOUD_ENV: ${{ inputs.env }}
        FPCLOUD_API_URL: ${{ inputs.api-url }}
      run: |
        set -euo pipefail
        : "${FPCLOUD_API_KEY:?auth must run first to export FPCLOUD_API_KEY}"

        base="${FPCLOUD_API_URL%/}"
        auth="Authorization: Bearer ${FPCLOUD_API_KEY}"

        # Resolve the app name -> id within the project (config is addressed by id).
        apps="$(curl -sS -H "${auth}" "${base}/api/v1/projects/${FPCLOUD_PROJECT}/apps")"
        app_id="$(printf '%s' "${apps}" | jq -r --arg n "${FPCLOUD_APP}" 'map(select(.name==$n)) | .[0].id // empty')"
        if [ -z "${app_id}" ]; then
          echo "::error::app '${FPCLOUD_APP}' not found in project '${FPCLOUD_PROJECT}'." >&2
          exit 1
        fi

        set_one() {
          # $1=key  $2=value
          local body code
          body="$(jq -n --arg k "$1" --arg v "$2" '{key:$k, value:$v}')"
          code="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "${auth}" -H "Content-Type: application/json" \
            -d "${body}" "${base}/api/v1/apps/${app_id}/config")"
          if [ "${code}" -lt 200 ] || [ "${code}" -ge 300 ]; then
            echo "::error::failed to set '$1' (HTTP ${code})." >&2
            exit 1
          fi
        }

        apply_block() {
          # $1=block text
          [ -z "$1" ] && return 0
          local line key value
          while IFS= read -r line || [ -n "${line}" ]; do
            case "${line}" in ''|'#'*) continue ;; esac
            if [ "${line%%=*}" = "${line}" ]; then
              echo "::error::invalid line (expected KEY=VALUE): ${line}" >&2
              exit 1
            fi
            key="${line%%=*}"
            value="${line#*=}"
            key="${key#"${key%%[![:space:]]*}"}"   # ltrim
            key="${key%"${key##*[![:space:]]}"}"    # rtrim
            set_one "${key}" "${value}"
            echo "set ${key}"
          done <<< "$1"
        }

        apply_block "${FPCLOUD_ENV}"
        echo "Config applied to app ${FPCLOUD_APP}."
